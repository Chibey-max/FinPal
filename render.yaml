# Render Blueprint: the Next.js app (Docker) and its Postgres database.
# Deploy from the Render dashboard: New > Blueprint, pick this repository.
databases:
  - name: finpal-db
    databaseName: finpal
    user: finpal
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: finpal-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Real data only. Mock mode must never run in production.
      - key: FINPAL_DATA_SOURCE
        value: live
      # Internal connection string; the server applies db/migrations on start.
      - key: DATABASE_URL
        fromDatabase:
          name: finpal-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      # Google Calendar prefill: an OAuth client plus a refresh token, so
      # access tokens renew automatically (a fixed token expires in ~1 hour).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # Groq: plain-language explanations and proposal drafts. Without a key
      # FinPal falls back to rule-based text; the model never changes a decision.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LOG_LEVEL
        value: info
