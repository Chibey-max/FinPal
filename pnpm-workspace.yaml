packages:
  - apps/*
  - packages/*
allowBuilds:
  # Bryntum trial postinstall only stamps a per-install trial id into the
  # bundle (obfuscated scripts, no network); the calendar works without it.
  "@bryntum/calendar-trial": false
  "@bryntum/calendar-trial-lib": false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@next/env@16.4.1"
  - "@next/eslint-plugin-next@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - eslint-config-next@16.4.1
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - "@expo/cli@57.0.32"
  - "@expo/config-plugins@57.0.11"
  - "@expo/router-server@57.0.14"
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo@57.0.31
  - "@expo/ui@57.0.26"
  - expo-router@57.0.29
